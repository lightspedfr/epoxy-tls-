name: Build ep082 WASM
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      release:
        description: "Run the full wasm-opt release pipeline (no debug info)"
        type: boolean
        default: false
      minimal:
        description: "Build with --no-default-features"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ep082-build-${{ github.ref }}
  cancel-in-progress: false

# Shared by both jobs so the compile and bundle steps always agree.
env:
  RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && '1' || '0' }}
  MINIMAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.minimal) && '1' || '0' }}

jobs:
  # ==========================================
  # PART 1: SYSTEM SETUP & CARGO COMPILATION
  # ==========================================
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq build-essential pkg-config

      - name: Install Rust nightly and WebAssembly target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          # -Z build-std needs the standard library sources
          components: rust-src

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI matching Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          LOCKFILE=$(cargo locate-project --workspace --message-format plain --manifest-path client/Cargo.toml)
          LOCKFILE="$(dirname "$LOCKFILE")/Cargo.lock"
          WBG_VERSION=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' "$LOCKFILE")
          if [ -z "$WBG_VERSION" ]; then
            echo "Could not find wasm-bindgen in $LOCKFILE" >&2
            exit 1
          fi
          echo "Installing wasm-bindgen-cli $WBG_VERSION"
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version | awk '{print $2}')" != "$WBG_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked --force
          fi

      - name: Rename epoxy source references to ep082
        shell: bash
        run: |
          set -euo pipefail
          git grep -Ilz -E 'epoxy|Epoxy' -- \
            '*.rs' '*.js' '*.mjs' '*.cjs' '*.ts' '*.sh' '*.html' '*.css' '*.json' '*.yml' '*.yaml' '*.toml' \
            ':!**/Cargo.toml' ':!**/Cargo.lock' ':!README*' ':!LICENSE*' ':!**/pkg/**' \
          | xargs -0 -r sed -i -e 's/epoxy/ep082/g' -e 's/Epoxy/Ep082/g'

      - name: Cargo Compile
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          CARGOFLAGS=""
          if [ "$MINIMAL" = "1" ]; then
            CARGOFLAGS="--no-default-features"
          fi

          export CFLAGS='-O3' RUSTFLAGS='-Zlocation-detail=none -C target-cpu=mvp --cfg getrandom_backend="wasm_js"'
          cargo build --target wasm32-unknown-unknown \
            -Z build-std=panic_abort,std -Z build-std-features=optimize_for_size \
            --release $CARGOFLAGS

      - name: Wasm Bindgen Generation
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          # Cargo.toml is excluded from the rename, so the crate still builds under
          # its original name. Look the real artifact up instead of guessing it.
          META=$(cargo metadata --no-deps --format-version 1 --manifest-path Cargo.toml)
          TARGET_DIR=$(jq -r '.target_directory' <<<"$META")
          LIB_NAME=$(jq -r --arg mf "$PWD/Cargo.toml" '
            .packages[] | select(.manifest_path == $mf)
            | .targets[] | select(.kind | index("cdylib")) | .name' <<<"$META" | tr '-' '_')
          WASM="$TARGET_DIR/wasm32-unknown-unknown/release/${LIB_NAME}.wasm"
          echo "Using $WASM"

          mkdir -p out/
          wasm-bindgen --target web --out-dir out/ --out-name ep082_client "$WASM"

      - name: Upload Intermediates
        uses: actions/upload-artifact@v4
        with:
          name: compiled-wasm-assets
          path: client/out/
          if-no-files-found: error

  # ==========================================
  # PART 2: OPTIMIZATION & METADATA TRANSFORM
  # ==========================================
  optimize_and_bundle:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install latest Binaryen (wasm-opt)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/binaryen"
          gh release download --repo WebAssembly/binaryen \
            --pattern 'binaryen-*-x86_64-linux.tar.gz' --output - \
          | tar -xz -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen/bin/wasm-opt" --version

      - name: Set up Node.js (for Terser)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Intermediates
        uses: actions/download-artifact@v4
        with:
          name: compiled-wasm-assets
          path: client/out/

      - name: Lowering and Optimization Cycles
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkg/

          if [ "$RELEASE" != "1" ]; then
            WASMOPTFLAGS="-g"
          else
            WASMOPTFLAGS=""
          fi

          mv out/ep082_client_bg.wasm out/ep082_client_unoptimized.wasm
          wasm-opt $WASMOPTFLAGS --signext-lowering out/ep082_client_unoptimized.wasm -o out/ep082_client_lowered.wasm

          if [ "$RELEASE" = "1" ]; then
            G="--generate-global-effects"
            time wasm-opt $WASMOPTFLAGS \
              out/ep082_client_lowered.wasm -o out/ep082_client_bg.wasm \
              --converge \
              $G --type-unfinalizing $G --type-ssa $G -O4 $G --flatten $G --rereloop $G -O4 $G -O4 $G --type-merging $G --type-finalizing $G -O4 \
              $G --type-unfinalizing $G --type-ssa $G -Oz $G --flatten $G --rereloop $G -Oz $G -Oz $G --type-merging $G --type-finalizing $G -Oz \
              $G --abstract-type-refining $G --code-folding $G --const-hoisting $G --dae $G --flatten $G --dfo $G --merge-locals $G --merge-similar-functions $G --type-finalizing \
              $G --type-unfinalizing $G --type-ssa $G -O4 $G --flatten $G --rereloop $G -O4 $G -O4 $G --type-merging $G --type-finalizing $G -O4 \
              $G --type-unfinalizing $G --type-ssa $G -Oz $G --flatten $G --rereloop $G -Oz $G -Oz $G --type-merging $G --type-finalizing $G -Oz
          else
            mv out/ep082_client_lowered.wasm out/ep082_client_bg.wasm
          fi

      - name: Transform Sources and Bundles
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VAL=$(jq -r '.version // "0.0.0"' package.json)
          AUTOGENERATED_INFO_FUNC="export const info = { version: \"$VERSION_VAL\", minimal: ${MINIMAL}===1, release: ${RELEASE}===1, commit: \"$(git rev-parse HEAD)\" };"
          AUTOGENERATED_INFO_FUNC_TYPE="export const info: { version: string, minimal: boolean, release: boolean, commit: string };"

          AUTOGENERATED_SOURCE=$(<"out/ep082_client.js")
          AUTOGENERATED_SNIPPET_PATH=$(<"out/ep082_client.js")

          AUTOGENERATED_SNIPPET_PATH=${AUTOGENERATED_SNIPPET_PATH#*\'}
          AUTOGENERATED_SNIPPET_PATH=${AUTOGENERATED_SNIPPET_PATH%%\'*}

          AUTOGENERATED_SNIPPET=$(base64 -w0 "${AUTOGENERATED_SNIPPET_PATH/#./out}")
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//${AUTOGENERATED_SNIPPET_PATH}/data:text/javascript$';'base64,${AUTOGENERATED_SNIPPET}}

          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//maximum:16384,shared:true/maximum:/iPad|iPhone|iPod/.test(navigator.userAgent)?4096:8192,shared:true}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//'_bg.wasm'/'.wasm'}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//'ep082_client.wasm'/'ep082.wasm'}

          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//export $'{' initSync $'};\n'/}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//if (wasm !== undefined) return wasm/if (wasm !== undefined) return}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//return __wbg_finalize_init/__wbg_finalize_init}

          echo "$AUTOGENERATED_SOURCE" > pkg/ep082.js
          echo "$AUTOGENERATED_INFO_FUNC" >> pkg/ep082.js

          WASM_BASE64=$(base64 -w0 out/ep082_client_bg.wasm)
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//__wbg_init(module_or_path) \{/__wbg_init(module_or_path) \{$'\n\t'module_or_path = module_or_path || $'{};\n\t'module_or_path.module_or_path=Uint8Array.from(atob(\'$WASM_BASE64\'), c=>c.charCodeAt(0))}

          echo "$AUTOGENERATED_SOURCE" > pkg/ep082-bundled.js
          echo "$AUTOGENERATED_INFO_FUNC" >> pkg/ep082-bundled.js

          AUTOGENERATED_TYPES=$(<"out/ep082_client.d.ts")
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//$'\n'export interface InitOutput*InitOutput;$'\n'/}
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//Promise<InitOutput>/Promise<void>}

          echo "$AUTOGENERATED_TYPES" > pkg/ep082.d.ts
          echo "$AUTOGENERATED_INFO_FUNC_TYPE" >> pkg/ep082.d.ts

          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//export type InitInput * WebAssembly.Module;/}
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//(module_or_path$'?':*Promise<InitInput>):/():}
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//If $'`'module_or_path* - Passing $'`'InitInput$'`' directly is deprecated./}

          echo "$AUTOGENERATED_TYPES" > pkg/ep082-bundled.d.ts
          echo "$AUTOGENERATED_INFO_FUNC_TYPE" >> pkg/ep082-bundled.d.ts

          cp out/ep082_client_bg.wasm pkg/ep082.wasm
          rm -rf out/

      - name: Minify JavaScript
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          # Property names are deliberately NOT mangled: the wasm import object
          # is keyed by __wbg_* names that the .wasm binary looks up by string.
          COMPRESS='passes=5,toplevel=true,module=true,ecma=2020,pure_getters=true,hoist_funs=true,booleans_as_integers=false,unsafe=true,unsafe_arrows=true,unsafe_comps=true,unsafe_math=true,unsafe_methods=true,unsafe_proto=true,unsafe_regexp=true,unsafe_undefined=true,drop_console=false'
          for f in pkg/ep082.js pkg/ep082-bundled.js; do
            BEFORE=$(stat -c%s "$f")
            npx --yes terser@5 "$f" \
              --module \
              --ecma 2020 \
              --compress "$COMPRESS" \
              --mangle toplevel=true \
              --format comments=false,ascii_only=false,wrap_func_args=false \
              --output "$f.min"
            mv "$f.min" "$f"
            echo "$f: $BEFORE -> $(stat -c%s "$f") bytes"
          done

      - name: Commit distribution outputs
        # A manual run from a tag has no branch to push to.
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f client/pkg/

          if git diff --cached --quiet; then
            echo "No changes to pkg; skipping commit."
            exit 0
          fi
          git commit -m "Build ep082 WebAssembly package"

          # The branch may have moved (including an earlier run's pkg commit)
          # since checkout; replay onto the tip, keeping this run's pkg files.
          git fetch origin "$GITHUB_REF_NAME"
          git rebase -X theirs "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
