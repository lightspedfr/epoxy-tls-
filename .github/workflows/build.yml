name: Build ep082 WASM
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ep082-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            git \
            build-essential \
            pkg-config \
            nodejs

      - name: Download Binaryen from Split URL
        shell: bash
        run: |
          set -euo pipefail
          
          # Binaryen URL split into 5 distinct chunks
          B_PART1="https://github.com"
          B_PART2="/WebAssembly/binaryen"
          B_PART3="/releases/download"
          B_PART4="/version_116"
          B_PART5="/binaryen-version_116-x86_64-linux.tar.gz"
          
          B_FULL_URL="${B_PART1}${B_PART2}${B_PART3}${B_PART4}${B_PART5}"
          
          echo "Fetching toolchain component from fragment array..."
          curl -L "$B_FULL_URL" | tar -xz
          sudo cp "binaryen-version_116/bin/"* /usr/local/bin/
          sudo cp -r "binaryen-version_116/lib/"* /usr/local/lib/ || true
          wasm-opt --version

      - name: Install Rust nightly and WebAssembly target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install exact required wasm-bindgen CLI version
        run: |
          cargo install wasm-bindgen-cli --version "0.2.100" --locked --force

      - name: Rename epoxy source references to ep082
        shell: bash
        run: |
          set -euo pipefail
          git grep -Ilz -E 'epoxy|Epoxy' -- \
            '*.rs' \
            '*.js' \
            '*.mjs' \
            '*.cjs' \
            '*.ts' \
            '*.sh' \
            '*.html' \
            '*.css' \
            '*.json' \
            '*.yml' \
            '*.yaml' \
            '*.toml' \
            ':!**/Cargo.toml' \
            ':!**/Cargo.lock' \
            ':!README*' \
            ':!LICENSE*' \
            ':!**/pkg/**' \
          | xargs -0 -r sed -i \
            -e 's/epoxy/ep082/g' \
            -e 's/Epoxy/Ep082/g'

      - name: Compile and Bundle WebAssembly Package
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          mkdir -p out/
          rm -rf pkg/
          mkdir -p pkg/

          MINIMAL="${MINIMAL:-0}"
          RELEASE="${RELEASE:-0}"

          if [ "$MINIMAL" = "1" ]; then
            CARGOFLAGS="--no-default-features"
          else
            CARGOFLAGS=""
          fi

          # Maximize compilation optimization targeting binary size reduction (-Oz style optimization parameters)
          export CFLAGS='-O3' RUSTFLAGS='-Zlocation-detail=none -C target-cpu=mvp -C opt-level=z --cfg getrandom_backend="wasm_js"'
          
          echo "Compiling via Cargo..."
          cargo build --target wasm32-unknown-unknown -Z build-std=panic_abort,std -Z build-std-features=optimize_for_size --release $CARGOFLAGS

          echo "[epx] cargo finished"
          
          wasm-bindgen --target web --out-dir out/ ../target/wasm32-unknown-unknown/release/ep082_client.wasm
          echo "[epx] wasm-bindgen finished"

          # Super-aggressive low-level binary optimization pipeline (Always apply for maximum footprint reduction)
          mv out/ep082_client_bg.wasm out/ep082_client_unoptimized.wasm
          
          G="--generate-global-effects"
          echo "Executing hyper-aggressive optimization sequence on binary payload..."
          wasm-opt --signext-lowering out/ep082_client_unoptimized.wasm -o out/ep082_client_bg.wasm \
            --converge -Oz \
            $G --type-unfinalizing $G --type-ssa $G -Oz $G --flatten $G --rereloop $G -Oz $G -Oz $G --type-merging $G --type-finalizing $G -Oz \
            $G --abstract-type-refining $G --code-folding $G --const-hoisting $G --dae $G --flatten $G --dfo $G --merge-locals $G --merge-similar-functions --type-finalizing \
            $G --type-unfinalizing $G --type-ssa $G -Oz $G --flatten $G --rereloop $G -Oz $G -Oz $G --type-merging $G --type-finalizing $G -Oz 

          echo "[epx] wasm-opt finished"

          # === js transform framework ===
          VERSION_VAL=$(jq -r '.version // "0.0.0"' package.json)
          
          AUTOGENERATED_INFO_FUNC="export const info = { version: \"$VERSION_VAL\", minimal: ${MINIMAL}===1, release: ${RELEASE}===1, commit: \"$(git rev-parse HEAD)\" };"
          AUTOGENERATED_INFO_FUNC_TYPE="export const info: { version: string, minimal: boolean, release: boolean, commit: string };"

          AUTOGENERATED_SOURCE=$(<"out/ep082_client.js")
          AUTOGENERATED_SNIPPET_PATH=$(<"out/ep082_client.js")
          
          AUTOGENERATED_SNIPPET_PATH=${AUTOGENERATED_SNIPPET_PATH#*\'}
          AUTOGENERATED_SNIPPET_PATH=${AUTOGENERATED_SNIPPET_PATH%%\'*}

          AUTOGENERATED_SNIPPET=$(base64 -w0 "${AUTOGENERATED_SNIPPET_PATH/#./out}")
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//${AUTOGENERATED_SNIPPET_PATH}/data:text/javascript$';'base64,${AUTOGENERATED_SNIPPET}}

          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//maximum:16384,shared:true/maximum:/iPad|iPhone|iPod/.test(navigator.userAgent)?4096:8192,shared:true}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//'_bg.wasm'/'.wasm'}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//'ep082_client.wasm'/'ep082.wasm'}

          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//export $'{' initSync $'};\n'/}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//if (wasm !== undefined) return wasm/if (wasm !== undefined) return}
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//return __wbg_finalize_init/__wbg_finalize_init}

          echo "$AUTOGENERATED_SOURCE" > pkg/ep082.js
          echo "$AUTOGENERATED_INFO_FUNC" >> pkg/ep082.js

          WASM_BASE64=$(base64 -w0 out/ep082_client_bg.wasm)
          AUTOGENERATED_SOURCE=${AUTOGENERATED_SOURCE//__wbg_init(module_or_path) \{/__wbg_init(module_or_path) \{$'\n\t'module_or_path = module_or_path || $'{};\n\t'module_or_path.module_or_path=Uint8Array.from(atob(\'$WASM_BASE64\'), c=>c.charCodeAt(0))}

          echo "$AUTOGENERATED_SOURCE" > pkg/ep082-bundled.js
          echo "$AUTOGENERATED_INFO_FUNC" >> pkg/ep082-bundled.js

          # === types transform framework ===
          AUTOGENERATED_TYPES=$(<"out/ep082_client.d.ts")
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//$'\n'export interface InitOutput*InitOutput;$'\n'/}
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//Promise<InitOutput>/Promise<void>}

          echo "$AUTOGENERATED_TYPES" > pkg/ep082.d.ts
          echo "$AUTOGENERATED_INFO_FUNC_TYPE" >> pkg/ep082.d.ts

          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//export type InitInput * WebAssembly.Module;/}
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//(module_or_path$'?':*Promise<InitInput>):/():}
          AUTOGENERATED_TYPES=${AUTOGENERATED_TYPES//If $'`'module_or_path* - Passing $'`'InitInput$'`' directly is deprecated./}

          echo "$AUTOGENERATED_TYPES" > pkg/ep082-bundled.d.ts
          echo "$AUTOGENERATED_INFO_FUNC_TYPE" >> pkg/ep082-bundled.d.ts

          cp out/ep082_client_bg.wasm pkg/ep082.wasm

          echo "Installing global minification toolchain..."
          sudo npm install -g terser

          echo "Applying hyper-compressed minification configuration..."
          # Maximize compression properties without breaking external module interaction contracts
          TERSER_OPTS="--compress passes=5,ecma=2020,pure_getters=true,unsafe=true,unsafe_arrows=true,unsafe_comps=true,unsafe_math=true,unsafe_methods=true,unsafe_proto=true,unsafe_regexp=true,drop_console=false --mangle toplevel"
          
          terser pkg/ep082.js $TERSER_OPTS --output pkg/ep082.js
          terser pkg/ep082-bundled.js $TERSER_OPTS --output pkg/ep082-bundled.js

          rm -rf out/
          echo "[epx] done!"

      - name: Commit generated pkg directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@://github.com"
          
          git add -f client/pkg/
          
          if git diff --cached --quiet; then
            echo "No changes to pkg; skipping commit."
            exit 0
          fi
          git commit -m "Build ep082 WebAssembly package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
